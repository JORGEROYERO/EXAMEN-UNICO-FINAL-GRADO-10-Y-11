<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examen único 2026 | El Profe Royero</title>
<style>
  :root {
    --navy: #1f2452; --navy-2: #2d3470; --gold: #c9a227; --gold-claro: #f3e7bf;
    --fondo: #f4f5fa; --texto: #232634; --gris: #6b6f80;
    --verde: #2e7d32; --verde-claro: #d4f5e6; --rojo: #c62828; --rojo-claro: #fbe0d8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Calibri, Arial, sans-serif; background: var(--fondo); color: var(--texto); line-height: 1.5; }
  header { background: var(--navy); color: #fff; padding: 14px 16px; border-bottom: 4px solid var(--gold); display: flex; align-items: center; justify-content: center; gap: 14px; }
  header img { width: 70px; height: 70px; border-radius: 50%; background: #fff; }
  header .marca { color: var(--gold); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  header h1 { margin: 2px 0; font-size: 23px; }
  header .sub { font-size: 13px; opacity: 0.85; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 14px 40px; }
  .tarjeta { background: #fff; border-radius: 12px; padding: 22px 20px; box-shadow: 0 2px 10px rgba(31,36,82,0.08); margin-bottom: 16px; }
  h2 { color: var(--navy); margin: 0 0 12px; font-size: 21px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; color: var(--navy); }
  select, input[type=text] { width: 100%; padding: 11px 12px; font-size: 16px; border: 1.5px solid #c8cbe0; border-radius: 8px; background: #fff; }
  .enlace { background: none; border: none; color: var(--navy-2); text-decoration: underline; cursor: pointer; padding: 6px 0; font-size: 14px; }
  .btn { display: inline-block; border: none; border-radius: 8px; padding: 12px 22px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px; }
  .btn-primario { background: var(--navy); color: #fff; }
  .btn-primario:disabled { background: #a9acc4; cursor: not-allowed; }
  .btn-secundario { background: var(--gold-claro); color: var(--navy); }
  .btn-rojo { background: var(--rojo); color: #fff; }
  .botones { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .aviso { font-size: 14px; color: var(--gris); }
  .barra { height: 8px; background: #e3e5f1; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .barra div { height: 100%; background: var(--gold); transition: width 0.3s; }
  .navegador { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .navegador button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #c8cbe0; background: #fff; font-weight: 700; color: var(--navy); cursor: pointer; }
  .navegador button.resp { background: var(--navy); color: #fff; border-color: var(--navy); }
  .navegador button.actual { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
  .contador { font-size: 14px; color: var(--gris); margin-bottom: 6px; }
  .enunciado { font-size: 17px; margin-bottom: 12px; }
  .figura { text-align: center; margin: 4px 0 12px; }
  .figura svg { max-width: 340px; width: 100%; height: auto; }
  .opcion { display: flex; gap: 10px; align-items: center; border: 2px solid #d9dcec; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; font-size: 17px; background: #fff; width: 100%; text-align: left; color: var(--texto); font-family: inherit; }
  .opcion:hover { border-color: var(--navy-2); }
  .opcion.elegida { border-color: var(--gold); background: #fffaf0; }
  .opcion .letra { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .opcion.elegida .letra { background: var(--gold); color: var(--navy); }
  .fx { font-family: "Cambria Math", "Times New Roman", serif; font-style: italic; font-size: 19px; white-space: nowrap; }
  .fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; margin: 0 2px; }
  .fr .nu { border-bottom: 1.5px solid currentColor; padding: 0 4px; }
  .fr .de { padding: 0 4px; }
  sup { font-size: 70%; }
  .nota-grande { text-align: center; margin: 8px 0; }
  .nota-grande .valor { font-size: 64px; font-weight: 800; color: var(--navy); line-height: 1; }
  .nota-grande .sobre { color: var(--gris); }
  .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
  .resumen div { background: var(--fondo); border-radius: 8px; padding: 10px; text-align: center; }
  .resumen .num { font-size: 24px; font-weight: 700; color: var(--navy); }
  .alerta { background: #fff3cd; border: 1.5px solid #e0b93a; border-radius: 8px; padding: 10px 12px; margin-top: 12px; }
  .marcas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .marcas span { width: 38px; height: 38px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .marcas .ok { background: var(--verde-claro); color: var(--verde); }
  .marcas .no { background: var(--rojo-claro); color: var(--rojo); }
  .marcas .nr { background: #eceef5; color: var(--gris); }
  .revision { border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; border: 1.5px solid #d9dcec; }
  .revision.ok { background: #f1fbf5; border-color: #9fd8b5; }
  .revision.no { background: #fdf3f0; border-color: #efb3a3; }
  .revision .cab { font-weight: 700; margin-bottom: 4px; color: var(--navy); }
  .revision .enunciado { font-size: 16px; }
  .op-rev { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border: 2px solid #e1e3ee; border-radius: 10px; padding: 8px 12px; margin-bottom: 7px; background: #fff; font-size: 16px; }
  .op-rev .letra { flex: 0 0 28px; height: 28px; border-radius: 50%; background: #c8cbe0; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .op-rev.correcta { border-color: var(--verde); background: var(--verde-claro); }
  .op-rev.correcta .letra { background: var(--verde); }
  .op-rev.errada { border-color: var(--rojo); background: var(--rojo-claro); }
  .op-rev.errada .letra { background: var(--rojo); }
  .marca-r { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--navy); }
  footer { text-align: center; font-size: 13px; color: var(--gris); padding: 10px; }
</style>
</head>

function generarFingerprint() {
  try { const g = localStorage.getItem("epr_fp"); if (g) return g; } catch (e) {}
  let datos = [navigator.userAgent, navigator.language, screen.width + "x" + screen.height, screen.colorDepth, new Date().getTimezoneOffset(), navigator.hardwareConcurrency || ""].join("|");
  try {
    const c = document.createElement("canvas"); const ctx = c.getContext("2d");
    ctx.textBaseline = "top"; ctx.font = "14px Arial"; ctx.fillText("El Profe Royero 2026", 2, 2);
    datos += "|" + c.toDataURL();
  } catch (e) {}
  let h = 5381;
  for (let i = 0; i < datos.length; i++) h = ((h << 5) + h + datos.charCodeAt(i)) >>> 0;
  const id = "EQ-" + h.toString(36).slice(0, 5).toUpperCase();
  try { localStorage.setItem("epr_fp", id); } catch (e) {}
  return id;
}

function guardar(curso, nombre, d) { try { localStorage.setItem(clave(curso, nombre), JSON.stringify(d)); } catch (e) {} }

function enviarRegistro(r, alTerminar) {
  let url = SCRIPT_URL +

    "&nombre=" + encodeURIComponent(r.nombre) +
    "&curso=" + encodeURIComponent(r.curso) +
    "&nivel=" + encodeURIComponent("Grado " + r.grado) +
    "&correctas=" + r.correctas +
    "&incorrectas=" + r.incorrectas +
    "&porcentaje=" + r.porcentaje +
    "&nota=" + r.nota.toFixed(1) +
    "&fecha=" + encodeURIComponent(r.fecha) +
    "&fingerprint=" + encodeURIComponent(generarFingerprint()) +
    "&inicio=" + encodeURIComponent(r.inicio) +
    "&fin=" + encodeURIComponent(r.fin) +
    "&duracion=" + encodeURIComponent(r.duracion) +
    "&total=" + r.total +
    "&id=" + encodeURIComponent(r.id || "");
  r.marcas.forEach(function (m, i) { url += "&p" + (i + 1) + "=" + encodeURIComponent(m); });
  const beacon = new Image();
  let hecho = false;
  function fin() { if (!hecho) { hecho = true; if (alTerminar) alTerminar(navigator.onLine !== false); } }
  beacon.onload = fin; beacon.onerror = fin;
  setTimeout(fin, 10000);
  beacon.src = url;
}

// ===================== ESTADO =====================
const estado = { curso: "", nombre: "", grado: "", resp: [], actual: 0, inicio: "", inicioMs: 0 };
function guardarProgreso() {
  guardar(estado.curso, estado.nombre, { enCurso: true, resp: estado.resp, actual: estado.actual, inicio: estado.inicio, inicioMs: estado.inicioMs });
}

// ===================== PANTALLAS =====================
function pantallaInicio() {
  let manual = false;
  app().innerHTML =
    '<div class="tarjeta"><h2>Bienvenido al examen único</h2>' +
    '<p>Elige tu curso y tu nombre. El simulador te mostrará el examen de tu grado.</p>' +
    '<label for="curso">Curso</label><select id="curso"><option value="">Selecciona tu curso</option>' +
    CURSOS.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join("") + '</select>' +
    '<div id="zonaNombre"></div>' +
    '<button class="btn btn-primario" id="continuar" disabled>Continuar</button></div>';
  const selCurso = document.getElementById("curso");
  const zona = document.getElementById("zonaNombre");
  const boton = document.getElementById("continuar");
  function nombreActual() { const c = document.getElementById("nombre"); return c ? c.value.trim() : ""; }
  function revisar() { boton.disabled = !(selCurso.value && nombreActual()); }
  function dibujarNombre() {
    const lista = ESTUDIANTES_POR_CURSO[selCurso.value] || [];
    if (!selCurso.value) { zona.innerHTML = ""; revisar(); return; }
    if (manual || lista.length === 0) {
      zona.innerHTML = '<label for="nombre">Nombre completo (apellidos y nombres)</label><input type="text" id="nombre" autocomplete="off">' +
        (lista.length ? '<button class="enlace" id="volverLista">Volver a la lista</button>' : '');
      const v = document.getElementById("volverLista");
      if (v) v.onclick = function () { manual = false; dibujarNombre(); };
      document.getElementById("nombre").oninput = revisar;
    } else {
      zona.innerHTML = '<label for="nombre">Nombre</label><select id="nombre"><option value="">Selecciona tu nombre</option>' +
        lista.map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join("") +
        '</select><button class="enlace" id="noAparece">Mi nombre no aparece en la lista</button>';
      document.getElementById("nombre").onchange = revisar;
      document.getElementById("noAparece").onclick = function () { manual = true; dibujarNombre(); };
    }
    revisar();
  }
  selCurso.onchange = function () { manual = false; dibujarNombre(); };
  boton.onclick = function () {
    estado.curso = selCurso.value;
    estado.nombre = nombreActual().toUpperCase();
    estado.grado = gradoDe(estado.curso);
    const previo = leer(estado.curso, estado.nombre);
    if (previo && previo.resultado) { pantallaResultado(previo.resultado, previo.enviado); return; }
    if (previo && previo.enCurso) {
      estado.resp = previo.resp; estado.actual = previo.actual || 0;
      estado.inicio = previo.inicio; estado.inicioMs = previo.inicioMs;
      pantallaPregunta(); return;
    }
    pantallaInstrucciones();
  };
}

function pantallaInstrucciones() {
  const ex = EXAMENES[estado.grado];
  const n = ex.preguntas.length;
  app().innerHTML =
    '<div class="tarjeta"><h2>' + ex.titulo + '</h2>' +
    '<p class="aviso">' + estado.nombre + ', curso ' + estado.curso + '</p>' +
    '<p>Temas: ' + ex.temas + '.</p>' +
    '<p>El examen tiene ' + n + ' preguntas de selección múltiple con una sola respuesta correcta. Puedes volver a una pregunta con los botones numerados mientras te falten preguntas por responder. ' +
    (estado.grado === "10" ? 'En los triángulos, el lado o el ángulo que debes resolver aparece en color rojo. ' : '') +
    'La nota va de 0.0 a 5.0.</p>' +
    (estado.grado === "11" ? '<div class="alerta">Reglas de apoyo: si f(x) = x<sup>n</sup>, entonces f\'(x) = n·x<sup>n−1</sup>; la derivada de una constante es 0; si f(x) = u · v, entonces f\'(x) = u\' · v + u · v\'. Para hallar el valor de una función cuando x = 2, reemplaza la x por 2 y resuelve.</div>' : '') +
    '<div class="alerta">Tienes un solo intento. Al elegir una respuesta pasas a la siguiente pregunta. Cuando respondas la última pregunta, el examen se califica y se envía al profesor automáticamente, y ya no podrás cambiar tus respuestas.</div>' +
    '<div class="botones"><button class="btn btn-secundario" id="volver">Volver</button><button class="btn btn-primario" id="empezar">Empezar el examen</button></div></div>';
  document.getElementById("volver").onclick = pantallaInicio;
  document.getElementById("empezar").onclick = function () {
    estado.resp = new Array(n).fill(null);
    estado.actual = 0;
    estado.inicio = ahora();
    estado.inicioMs = Date.now();
    guardarProgreso();
    pantallaPregunta();
  };
}

function pantallaPregunta() {
  const ex = EXAMENES[estado.grado];
  const n = ex.preguntas.length;
  const i = estado.actual;
  const q = ex.preguntas[i];
  const respondidas = estado.resp.filter(function (r) { return r !== null; }).length;
  let nav = '';
  for (let k = 0; k < n; k++) {
    nav += '<button data-k="' + k + '" class="' + (estado.resp[k] !== null ? 'resp ' : '') + (k === i ? 'actual' : '') + '">' + (k + 1) + '</button>';
  }
  let ops = '';
  q.op.forEach(function (o, k) {
    ops += '<button class="opcion' + (estado.resp[i] === k ? ' elegida' : '') + '" data-o="' + k + '"><span class="letra">' + LETRAS[k] + '</span><span>' + o + '</span></button>';
  });
  app().innerHTML =
    '<div class="tarjeta">' +
    '<div class="contador">Pregunta ' + (i + 1) + ' de ' + n + '. Respondidas: ' + respondidas + ' de ' + n + '.</div>' +
    '<div class="barra"><div style="width:' + (100 * respondidas / n) + '%"></div></div>' +
    '<div class="navegador">' + nav + '</div>' +
    '<div class="enunciado">' + (i + 1) + '. ' + q.t + '</div>' +
    (q.fig ? '<div class="figura">' + q.fig + '</div>' : '') +
    ops +
    '<div class="botones">' +
    '<button class="btn btn-secundario" id="ant"' + (i === 0 ? ' disabled style="visibility:hidden"' : '') + '>Anterior</button>' +
    (i < n - 1 ? '<button class="btn btn-primario" id="sig">Siguiente</button>' : '') +
    '</div></div>';
  app().querySelectorAll(".navegador button").forEach(function (b) {
    b.onclick = function () { estado.actual = +b.dataset.k; guardarProgreso(); pantallaPregunta(); };
  });
  app().querySelectorAll(".opcion").forEach(function (b) {
    b.onclick = function () {
      if (estado.bloqueado) return;
      estado.resp[i] = +b.dataset.o;
      estado.bloqueado = true;
      app().querySelectorAll(".opcion").forEach(function (x) { x.classList.toggle("elegida", x === b); });
      setTimeout(function () {
        estado.bloqueado = false;
        let sig = -1;
        for (let k = 1; k <= n; k++) { const j = (i + k) % n; if (estado.resp[j] === null) { sig = j; break; } }
        if (sig === -1) { finalizar(); return; }
        estado.actual = sig; guardarProgreso(); pantallaPregunta();
      }, 350);
    };
  });
  const ant = document.getElementById("ant");
  if (ant) ant.onclick = function () { estado.actual--; guardarProgreso(); pantallaPregunta(); };
  const sig = document.getElementById("sig");
  if (sig) sig.onclick = function () { estado.actual++; guardarProgreso(); pantallaPregunta(); };
  window.scrollTo(0, 0);
}

function pantallaConfirmar() {
  const n = estado.resp.length;
  const faltan = [];
  estado.resp.forEach(function (r, k) { if (r === null) faltan.push(k + 1); });
  app().innerHTML =
    '<div class="tarjeta"><h2>¿Terminar el examen?</h2>' +
    (faltan.length
      ? '<div class="alerta">Te faltan ' + faltan.length + ' de ' + n + ' preguntas por responder: ' + faltan.join(", ") + '. Las preguntas sin responder cuentan como incorrectas.</div>'
      : '<p>Respondiste las ' + n + ' preguntas.</p>') +
    '<p>Después de terminar no podrás cambiar tus respuestas ni presentar el examen otra vez.</p>' +
    '<div class="botones"><button class="btn btn-secundario" id="revisar">Revisar mis respuestas</button><button class="btn btn-rojo" id="si">Sí, terminar</button></div></div>';
  document.getElementById("revisar").onclick = function () { estado.actual = faltan.length ? faltan[0] - 1 : 0; pantallaPregunta(); };
  document.getElementById("si").onclick = finalizar;
}

function finalizar() {
  const ex = EXAMENES[estado.grado];
  const n = ex.preguntas.length;
  let correctas = 0;
  const marcas = ex.preguntas.map(function (q, k) {
    const r = estado.resp[k];
    if (r === null) return "-";
    if (r === q.ok) { correctas++; return "✓ " + LETRAS[r]; }
    return "✗ " + LETRAS[r];
  });
  const finMs = Date.now();
  const r = {
    id: generarFingerprint() + "-" + Date.now().toString(36),
    nombre: estado.nombre, curso: estado.curso, grado: estado.grado, total: n,
    correctas: correctas, incorrectas: n - correctas,
    porcentaje: Math.round(100 * correctas / n),
    nota: Math.round(50 * correctas / n) / 10,
    marcas: marcas,
    resp: estado.resp.slice(),
    inicio: estado.inicio, fin: ahora(), fecha: ahora(),
    duracion: Math.max(0, Math.round((finMs - (estado.inicioMs || finMs)) / 60000))
  };
  guardar(estado.curso, estado.nombre, { resultado: r, enviado: false });
  pantallaResultado(r, false);
  enviarRegistro(r, function (ok) {
    if (ok) { guardar(r.curso, r.nombre, { resultado: r, enviado: true }); pantallaResultado(r, true); }
    else { const e = document.getElementById("estadoEnvio"); if (e) e.textContent = "No hay conexión a internet. Conéctate y pulsa Reenviar resultado."; }
  });
}

function pantallaResultado(r, enviado) {
  const ex = EXAMENES[r.grado];
  let rev = '';
  ex.preguntas.forEach(function (q, k) {
    const elegida = r.resp ? r.resp[k] : null;
    const bien = elegida === q.ok;
    let ops = '';
    q.op.forEach(function (o, j) {
      let cls = '', marca = '';
      if (j === q.ok) { cls = ' correcta'; marca = '<span class="marca-r">Respuesta correcta</span>'; }
      if (j === elegida && !bien) { cls = ' errada'; marca = '<span class="marca-r">Tu respuesta</span>'; }
      if (j === elegida && bien) { marca = '<span class="marca-r">Tu respuesta, correcta</span>'; }
      ops += '<div class="op-rev' + cls + '"><span class="letra">' + LETRAS[j] + '</span><span>' + o + '</span>' + marca + '</div>';
    });
    rev += '<div class="revision ' + (bien ? 'ok' : 'no') + '"><div class="cab">' + (k + 1) + '. ' + (bien ? '✓ Correcta' : (elegida === null ? '− Sin responder' : '✗ Incorrecta')) + '</div>' +
      '<div class="enunciado">' + q.t + '</div>' + (q.fig ? '<div class="figura">' + q.fig + '</div>' : '') + ops + '</div>';
  });
  app().innerHTML =
    '<div class="tarjeta"><h2>' + ex.titulo + '</h2>' +
    '<p class="aviso">' + r.nombre + ', curso ' + r.curso + '. Terminado: ' + r.fin + '</p>' +
    '<div class="nota-grande"><div class="valor">' + r.nota.toFixed(1) + '</div><div class="sobre">sobre 5.0</div></div>' +
    '<div class="resumen"><div><div class="num">' + r.correctas + '</div>correctas</div><div><div class="num">' + r.incorrectas + '</div>incorrectas</div><div><div class="num">' + r.porcentaje + '%</div>de aciertos</div></div>' +
    '<p id="estadoEnvio" class="aviso">' + (enviado ? 'Tu resultado fue enviado al profesor.' : 'Enviando tu resultado al profesor...') + '</p>' +
    (enviado ? '' : '<button class="btn btn-secundario" id="reenviar">Reenviar resultado</button>') +
    '</div>' +
    '<div class="tarjeta"><h2>Retroalimentación</h2><p class="aviso">En verde está la respuesta correcta de cada pregunta. Si te equivocaste, tu respuesta aparece en rojo.</p>' + rev + '</div>';
  const re = document.getElementById("reenviar");
  if (re) re.onclick = function () {
    document.getElementById("estadoEnvio").textContent = "Enviando tu resultado al profesor...";
    enviarRegistro(r, function (ok) {
      if (ok) { guardar(r.curso, r.nombre, { resultado: r, enviado: true }); pantallaResultado(r, true); }
      else document.getElementById("estadoEnvio").textContent = "No hay conexión a internet. Conéctate y pulsa Reenviar resultado.";
    });
  };
  window.scrollTo(0, 0);
}

pantallaInicio();
</script>
</body>
</html>
